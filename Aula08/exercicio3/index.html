<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habilitar e Desabilitar Botão</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Botão principal -->
    <button id="meuBotao" disabled>
        Botão de Ação
    </button>

    <!-- Botões de controle -->
    <div class="controles">
        <button onclick="ativarBotao()">
            Habilitar Botão
        </button>

        <button onclick="desativarBotao()">
            Desabilitar Botão
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
